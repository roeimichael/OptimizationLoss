name: pre-flight gates

# WHAT THIS IS FOR. `tests/` gates the code; `tests/gates/` gates the
# EXPERIMENT -- six buckets encoding failure modes this project actually paid
# for. Stages 2-6 run on CPU with no dataset and no GPU, so they belong in CI.
# Stage 1 needs the iwildcam slice, which is server-only, so it SKIPS here
# rather than silently passing: a gate that reports green without running is
# the exact defect class FRAMEWORK 2(z25) is about.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one red bucket must not hide the others
      matrix:
        stage: [data, budget, model, grid, trainlog, results]
    name: stage ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas pyyaml scipy scikit-learn pytest
      - name: pre-flight ${{ matrix.stage }}
        run: python -m scripts.preflight --stage ${{ matrix.stage }} -rs

  suite:
    runs-on: ubuntu-latest
    name: full regression suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas pyyaml scipy scikit-learn pytest
      - name: pytest
        run: python -m pytest tests -q
