# THE PROTOCOL. Every value the generator emits comes from this file.
#
# gen_campaign.py contains NO experimental constants -- if a number decides what
# an experiment does, it is here. Two rules keep this honest, both enforced by
# `python -m scripts.audit_config`:
#
#   1. Every key emitted must be READ by the methodology it is emitted for.
#      A key the code never reads makes a config claim a knob that does not
#      exist (base_loss, rho_step and alpha_kl were each exactly that).
#   2. Every key the code reads must be EMITTED, never left to a default.
#      hounie_rcl's inline default is 0.1 while the paper says 0.01, so an
#      unset key silently ran a different method.
#
# Read sets are per methodology, so an arm carries its own block and nothing
# else: `lambda_step` on the fioretto arm would be hallucinated even though
# tralo reads it.

protocol:
  total_epochs: 30        # optimizer epochs, IDENTICAL both sides = equal compute
  trained_warmup: 1       # warm-up 50 saturates CE; warm-up 5 is a dead zone
  seeds: [1, 2, 3, 4]

# Emitted on EVERY arm and verified by scripts/check_parity.py. These four are
# the comparison contract itself, so they are written even where the training
# code does not read them (constraint_epochs: 0 states "this arm has no
# constraint phase", which is what makes equal compute checkable).
contract_keys: [warmup_epochs, constraint_epochs, seed, lr]

# Read by the shared warm-up for every methodology (src/pipeline/warmup.py,
# src/models/model_factory.py).
core:
  lr: 0.0001
  dropout: 0.3
  batch_size: 64
  pretrained: true
  class_weighted_ce: false

# Read only by methodologies that run a constraint phase.
constraint_phase:
  # The unit gradient clip on the constraint step. THIS is the treatment dose.
  # The raw constraint gradient norm is 2,560-12,400, so the clip discards
  # essentially all of the magnitude and delivers exactly this value -- which is
  # what makes the lambda ratchet and the rho ramp no-ops by construction. It
  # was hardcoded as 1.0 in four trainers, invisible to audit_config, while
  # protocol.yml claimed "if a number decides what an experiment does, it is
  # here". It is the only dose axis the protocol admits: lr_constraint is
  # locked equal to lr, and every magnitude knob below it is cancelled by this
  # clip. Sweep 0.3 / 1.0 / 3.0 to get a dose-response curve.
  constraint_grad_clip: 1.0
  # How the constraint gradient is BOUNDED. "clip" caps it at
  # constraint_grad_clip; "normalize" rescales it to EXACTLY that value.
  # MEASURED 2026-08-20, results/vit_diag seed 1 -- same warm-up model, and all
  # three configs saying constraint_grad_clip: 1.0:
  #     tralo     raw norm 0.638 .. 1826.5    clip binds  6 of 7
  #     fioretto  raw norm 17,667 .. 80,827   clip binds 18 of 18
  #     hounie    raw norm 0.005 .. 0.1105    clip binds  0 of 29
  # One absolute clip across three natural scales means tralo and fioretto each
  # deliver a unit-norm step while hounie delivers its raw ~0.05-norm step -- a
  # ~20x dose gap that NO config gate can see, because every config says 1.0.
  # "normalize" makes the constraint step size a protocol constant identical
  # across arms, leaving each method's DIRECTION as its actual contribution,
  # which is what the comparison is supposed to be about.
  constraint_grad_mode: clip
  # Evaluate the constraint pass in fp32 and bypass the loss scaler. fioretto
  # lost 10 of its 29 constraint epochs to non-finite gradients (6 NaN + 4 inf,
  # RAW count -- calling dropna() first hides the NaN and reports 4). It recurs
  # rather than settling because the 126 CE steps per epoch grow the loss scale
  # back up between constraint steps, and fioretto's constraint loss is ~1e4
  # times CE's. One backward per epoch, so the cost is small.
  constraint_fp32: false
  # Which rule takes the constraint step. "shared" uses the same Adam the CE
  # pass just took 126 steps with, which leaves cos(parameter update,
  # constraint gradient) at 0.009-0.017 -- the constraint step is ~98% a 127th
  # CE step. "sgd" takes p -= lr_constraint * g directly, recovering the
  # direction at a step of norm lr_constraint * ||g|| exactly.
  # NOT the rejected `separate_constraint_optimizer`: that used a dedicated
  # ADAM, whose 1/sqrt(v) makes the step ~lr*sqrt(N) -- roughly 8,900x larger
  # at ViT-B/16 scale -- so it confounded direction with a huge dose increase
  # and cost AP -0.0938. With constraint_grad_mode: normalize the step here is
  # exactly lr_constraint * constraint_grad_clip = 1e-4, the SMALLEST dose in
  # that sweep, with the direction fully recovered. Opposite corner.
  constraint_step_rule: shared

  # THE CONTROL FOR "DID THE DIRECTION MATTER?". Replaces the constraint
  # gradient with a random vector of the SAME norm, so the dose is held and
  # only the information is removed. It exists because the measured damage
  # looks direction-independent: on dermmnist multi-class the constraint
  # cost exactly 4 correct capped-class predictions out of 89 at every one
  # of three seeds (d capF1 -0.0149/-0.0150/-0.0149, sd 0.0001) while the
  # count trajectories behind those seeds ended at 57, 201 and 439. If a
  # random step of the same size costs the same 4, the penalty contributed
  # nothing a coin could not have.
  constraint_random_direction: false
  lr_constraint: 0.0001       # MUST equal core.lr -- unequal lr fabricated a -16.7pp finding
  stable_count_threshold: 31
  constraint_chunk_size: 256
  enable_checkpoint_restore: false
  # Stop the CE pass once train accuracy has converged, so the remaining
  # constraint epochs are not outvoted. MEASURED 2026-08-20 on ViTB16 x
  # dermmnist: every constraint epoch runs 126 CE optimizer steps and then ONE
  # clipped constraint step, and TraLO's capped-class count went 125 -> 281
  # against a budget of 67 -- the constraint phase made the violation WORSE and
  # never satisfied on any epoch. An older version of this project turned CE off
  # at saturation and TraLO satisfied. That mechanism was deleted for being
  # declared by TraLO ALONE (gate off for TraLO, on for both duals, a 0.22 cc-F1
  # artifact against a 0.019-0.031 margin) -- never for being harmful when
  # applied fairly. It lives in THIS block, which every trained arm includes and
  # no post-hoc arm does, so it cannot reach one arm and not another.
  # 0.0 = off, which is the behaviour every result so far was produced under.
  #
  # THRESHOLD, set from the control campaign rather than inherited: TraLO's
  # train accuracy does not climb monotonically past 0.995, it OSCILLATES --
  # 0.9833 (ep10), 0.9936 (ep15), 0.9873 (ep20), 0.9934 (ep25), 0.9966 (ep30).
  # The old code's 0.995 with patience 2 would therefore fire around epoch 28,
  # or never, and the treatment would barely run while reading as a null. From
  # epoch 10 onward every logged epoch is >= 0.983, so 0.98 fires at ~epoch 11
  # and leaves ~19 constraint-only epochs. 0.98 is also the more defensible
  # definition of "converged": at 0.98 train against 0.81 test, further CE is
  # memorisation, not learning.
  ce_skip_acc: 0.0
  ce_skip_patience: 2

# Read by the post-hoc allocators that chunk their forward pass.
chunked:
  constraint_chunk_size: 256

blocks:
  tralo:
    lambda_step: 0.05
    lambda_global: 0.01       # initial lambda, global scope
    lambda_local: 0.01        # initial lambda, local (per-group) scope
    # The per-scope penalty shape. "rational_bounded" is the manuscript's Eq. 4
    # and stays the DEFAULT -- changing it would silently reinterpret every
    # stored result. "linear" (E/K) and "squared" ((E/K)^2) exist because the
    # bounded shape's gradient is NON-MONOTONE in the violation above rho ~ 1:
    # near zero at the boundary, peaking around 53-58% over, decaying toward zero
    # for anything worse, so a scope 8x over budget gets 167x LESS pull than one
    # 58% over. With ONE term that cancels (scalar x fixed direction, divided out
    # by the clip). With several it sets their relative weights, backwards.
    # MEASURED on a real multi-class run 2026-08-20 (dermmnist, classes 2+4,
    # L30_G20, 4 epochs): class 4 at 1.3x budget was pulled to 57 against K=45,
    # while class 2 at 9.3x budget ROSE to 410 against K=44 and was never
    # touched. Single-class spread across scopes has median 1.5x; this is ~30x,
    # which is why multi-class is where the shape stops being inert.
    penalty_shape: rational_bounded
    # ^ TraLO-SPECIFIC on purpose: the duals do not have this penalty at all
    # (fioretto sums probabilities, hounie uses a mean violation), so a
    # shared-block key would be emitted to them and read by none of them --
    # audit_config flagged exactly that, 6 arms, before this moved here.
    initial_rho: 0.5
    rho_target: 100.0         # rho_step is DERIVED from this; a config rho_step is ignored
    # WHERE THE COUNT PUTS ITS GRADIENT. `sum` is the manuscript's count
    # s_c = sum_i p_ic, whose per-item derivative is p(1-p). At the K-th RANKED
    # item that is 0.026 at L30_G20 (0 of 4 seeds responded) vs 0.055 at
    # L50_G30 (4 of 4), and 0.0009 once CE has converged -- which is what "CE
    # saturates" means and why warm-up 50 is a dead regime.
    #
    # WARNING: rank K is NOT the decision boundary. When the hard count is 300
    # against K = 44 the boundary is at item 300 and rank 44 is buried inside
    # the class; at the boundary p(1-p) is near its MAXIMUM and `sum` already
    # puts 29.4% of its gradient on the 20 items nearest it. So the margin
    # window buys less than "the gradient cannot reach the cut" implies --
    # at most 1.30x on the items that must flip. FRAMEWORK section 4.
    #
    # `margin` keeps the count and moves its weight: it replaces p_ic with
    # sigmoid((p_ic - max_{c' != c} p_ic')/T) -- the softened ARGMAX -- whose
    # derivative peaks at the DECISION BOUNDARY, on the items one step from
    # flipping. Summed it tracks the HARD count rather than the probability
    # mass, so it is also the tighter relaxation. It is a function of an item's
    # own row, so it needs no order statistic and the chunked construction
    # still gives the exact full-N gradient.
    #
    # NOT an order statistic. Centring the window on the K-th largest
    # probability is the obvious version and it is DEAD: it counts how many
    # items exceed the K-th largest, which is K-0.5 for any model whatsoever.
    # A constant, so relu(s-K) is identically zero and it produces no gradient
    # at all. Wired into the trainer, caught by the chunked-gradient test
    # before it reached a GPU. A soft count must be able to EXCEED the budget.
    soft_count_mode: sum
    cut_window_items: 5       # ONLY read when soft_count_mode: margin. A DOSE.
    # WHAT THE PENALTY READS. false = the soft count's own value, which is the
    # manuscript. true = the HARD count, with the soft count supplying only the
    # gradient (straight-through, free from the chunked detach construction).
    #
    # SEPARATE FROM soft_count_mode ON PURPOSE. Two different defects: the
    # count's VALUE (sum_i p_ic tracks probability mass, not the hard count --
    # on a toy it moved the count AWAY from the budget, 35 against a lambda=0
    # control's 31) and the gradient's PLACEMENT (p(1-p) vs the margin window).
    # Measured on the stored evidence, placement is worth at most 1.30x on the
    # items that must actually flip, so an effect much larger than that is the
    # value fix and not the window. Bundled, they are unattributable.
    straight_through: false
    # ^ sweep {2, 5, 10, 20}. Measured GPU-free on the stored evidence (160
    # (class, cell) points, 3 datasets, end-of-run predictions), share of each
    # count's gradient landing on the 20 items nearest the DECISION BOUNDARY:
    #   sum 29.4% | margin at 2 items 96.1%, 5 -> 82.3%, 10 -> 45.5%,
    #   20 -> 13.3%, 40 -> 3.7%. The crossover is between 10 and 20, so a wide
    # window is WORSE-targeted than the plain count, not better: at 40 items
    # the derived T is 0.18-0.57 and the sigmoid is flat over the whole margin
    # range. Narrow concentrates but raises variance -- at 2 items the step
    # direction is set by two items and `normalize` scales that to unit norm.
    # ^ the sigmoid width T is DERIVED from this, per class, per epoch, so the
    # window always holds this many items. A fixed T is not a fixed dose:
    # measured on the stored dermmnist evidence, the T holding ~20 items spans
    # 0.182 .. 0.502 ACROSS SEEDS OF ONE CELL, and T = 0.02 -- a plausible
    # guess -- puts 0 to 3 items in the window, i.e. the constraint does
    # nothing and the run reports a null while writing `completed`. Same
    # defect `constraint_grad_mode: normalize` fixes on the other axis.
    #
    # It moves ONLY where the gradient lands, never what the count says: the
    # penalty reads the HARD count via the chunked construction's own detach
    # (value hard, gradient windowed). Without that the window over-counts and
    # the penalty keeps pushing after the cap is satisfied.
  # The margin count, as an ARM rather than a global override, so it and the
  # manuscript's count can sit in ONE campaign. An arm-vs-arm delta is not a
  # result until the bar is in the same campaign, and that applies to two
  # estimators of the same constraint exactly as it applies to two methods.
  # THE COIN. Same step NORM, no information -- the direction is replaced by a
  # random vector. One coin serves every trained arm: the randomisation happens
  # after the gradient is formed, so which count produced it is irrelevant.
  # It is an ARM and not the campaign-wide --constraint-random-direction flag
  # because that flag randomises EVERY arm, which means the coin can never sit
  # in the same campaign as the thing it controls -- and an arm-vs-arm delta is
  # not a result until the bar is in the same campaign.
  tralo_coin:
    constraint_random_direction: true
  tralo_st:
    straight_through: true
  tralo_margin:
    soft_count_mode: margin
    straight_through: true
  # THE NULL-TREATMENT CONTROL. Identical to `tralo` in warm-up length, optimizer
  # restart, epoch count, transductive passes and allocator -- with the treatment
  # removed. total_constraint == 0 makes has_constraint False, so pass 2 is
  # skipped entirely, and the ratchet adds lambda_step = 0 so lambda stays 0
  # forever.
  #
  # Why it has to exist: the ten arms split into six post-hoc arms with ZERO
  # test-set access during training and four trained arms with 29 transductive
  # epochs plus a fresh Adam plus a count gradient. Nothing separates those, so
  # the tralo-vs-clip delta bundles four things at once -- the count gradient,
  # the optimizer restart (a measured 3.72x step-size kick), 29 epochs of
  # transductive forward/backward, and a 2.7-22.3% compute excess. The project's
  # own most-quoted fact is that REGIME beats METHOD by ~80x, and until this arm
  # runs there is no measurement that separates them.
  tralo_null:
    lambda_step: 0.0
    lambda_global: 0.0
    lambda_local: 0.0
    initial_rho: 0.5
    rho_target: 100.0
  fioretto:
    fioretto_step_size: 0.005     # REQUIRED: fioretto_ldf/train.py raises without it
  # Zero dose. lambda inits at 0.0 and only step_size moves it, so the primal
  # term is never added (gated `if lambda_g[c] > 0`, fioretto_ldf/train.py:251).
  fioretto_null:
    fioretto_step_size: 0.0
  hounie:
    hounie_eta_lambda: 0.01       # inline default is 0.1 -- 10x the paper. Never omit.
    hounie_eta_u: 0.01
    hounie_alpha: 10.0
  # Zero dose. eta_u is deliberately NOT zeroed: hounie_rcl/train.py:85 refuses
  # abs(1 - 2*eta_u*alpha) >= 1.0, and eta_u=0 gives exactly 1.0, so the arm
  # would raise. eta_u moves only the slack u, which cannot reach the primal
  # once lam is pinned at its 0.0 init.
  hounie_null:
    hounie_eta_lambda: 0.0
    hounie_eta_u: 0.01
    hounie_alpha: 10.0
  alm:
    alm_eta: 0.005
    alm_mu0: 0.01
    alm_mu_step: 0.01
    fioretto_lambda_init: 0.0
    enable_checkpoint_restore: false
  # Zero dose. mu0 MUST be zeroed with the rest: the weight is
  # lambda + mu_t*r+ with mu_t = mu0 + mu_step*epoch, so leaving mu0 at 0.01
  # gives a live augmentation -- a weak treatment wearing a control's name.
  alm_null:
    alm_eta: 0.0
    alm_mu0: 0.0
    alm_mu_step: 0.0
    fioretto_lambda_init: 0.0
    enable_checkpoint_restore: false
  lp:
    danits_cost_preset: identity  # identity misclassification cost, per the paper
  focal:
    warmup_loss: focal
    # focal_alpha is DEAD as implemented. imbalanced_losses.py multiplies the
    # WHOLE loss by alpha rather than using Lin et al.'s per-class balancing
    # factor alpha_t, and Adam is scale-invariant, so a 10,000x change in alpha
    # leaves argmax agreement at 1.0000 and the max logit delta at 5.8e-07.
    # (Under plain SGD the same change moves 46% of predictions, so the loss
    # genuinely differs -- it is Adam that cancels it.) focal_gamma IS live:
    # gamma=5 gives 0.9531 agreement against gamma=2.
    #
    # Left at the paper's value so the config still documents intent, but this
    # arm is gamma-only focal loss, and the manuscript should say so or the
    # implementation should take a per-class alpha_t.
    focal_alpha: 0.25
    focal_gamma: 2.0
  class_balanced:
    warmup_loss: class_balanced
    cb_beta: 0.9999
  logit_adjust:
    warmup_loss: logit_adjust
    logit_adjust_tau: 1.0

# `phase: posthoc`  -> warm-up total_epochs, constraint 0 (the warm-up IS the run)
# `phase: trained`  -> warm-up trained_warmup, constraint total_epochs - trained_warmup
arms:
  clip:       {methodology: heuristic,      phase: posthoc, blocks: []}
  focal_clip: {methodology: heuristic,      phase: posthoc, blocks: [focal]}
  lp:         {methodology: danits_lp,      phase: posthoc, blocks: [chunked, lp]}
  focal_lp:   {methodology: focal,          phase: posthoc, blocks: [chunked, focal]}
  cb_lp:      {methodology: class_balanced, phase: posthoc, blocks: [chunked, class_balanced]}
  la_lp:      {methodology: logit_adjust,   phase: posthoc, blocks: [chunked, logit_adjust]}
  tralo:      {methodology: tralo,          phase: trained, blocks: [constraint_phase, tralo]}
  # Same everything, one key different: WHERE the count puts its gradient.
  # Shares `tralo_null` as its control -- at lambda 0 there is no constraint
  # gradient at all, so the choice of soft count is inert and a second null
  # would be a bit-identical run costing a full GPU slot.
  # The 2x2 minus its useless corner. `tralo` is (soft value, p(1-p) placement)
  # = the manuscript; `tralo_st` fixes only the VALUE; `tralo_margin` fixes both.
  # The fourth corner -- margin placement on a soft value -- over-counts (56.6
  # against a hard 45) and pushes past feasibility, which is measured and is the
  # joint arm's failure mode, so it is not an arm.
  tralo_coin:
    {methodology: tralo, phase: trained, blocks: [constraint_phase, tralo, tralo_coin],
     null_sibling: tralo_null}
  tralo_st:
    {methodology: tralo, phase: trained, blocks: [constraint_phase, tralo, tralo_st],
     null_sibling: tralo_null}
  tralo_margin:
    {methodology: tralo, phase: trained, blocks: [constraint_phase, tralo, tralo_margin],
     null_sibling: tralo_null}
  # Same code path as tralo, treatment zeroed. See the tralo_null block above.
  tralo_null: {methodology: tralo,          phase: trained, blocks: [constraint_phase, tralo_null]}
  fioretto:   {methodology: fioretto_ldf,   phase: trained, blocks: [constraint_phase, fioretto]}
  hounie:     {methodology: hounie_rcl,     phase: trained, blocks: [constraint_phase, hounie]}
  alm:        {methodology: fioretto_alm,   phase: trained, blocks: [constraint_phase, alm]}
  # One zero-dose sibling per trained arm. Same code path, same warm-up, same
  # epoch count, same optimizer restart, same transductive passes, same
  # allocator -- treatment zeroed. See each _null block above for what "zeroed"
  # means in that arm; it is a different knob in each, and two have traps.
  fioretto_null: {methodology: fioretto_ldf, phase: trained, blocks: [constraint_phase, fioretto_null]}
  hounie_null:   {methodology: hounie_rcl,   phase: trained, blocks: [constraint_phase, hounie_null]}
  alm_null:      {methodology: fioretto_alm, phase: trained, blocks: [constraint_phase, alm_null]}

# Added to every campaign whether requested or not: an arm-vs-arm delta is not a
# result until the bar is in the same campaign.
mandatory_arms: [clip, focal_clip]
# NOT mandatory yet -- that is Roei's call, and it is the same argument that put
# the clippers here. Every trained arm now HAS a zero-dose sibling
# (`tralo_null`, `fioretto_null`, `hounie_null`, `alm_null`) separating the
# REGIME -- warm-up 1 + 29 transductive epochs + optimizer restart -- from the
# TREATMENT, the count gradient. Without the sibling in the campaign, an
# arm-vs-clip delta cannot be attributed to the constraint at all.
#
# Left opt-in rather than auto-added because adding four arms DOUBLES the
# trained half of a campaign, and that is a compute decision, not a hygiene one.
# gen_campaign warns when a trained arm is selected without its sibling.
# Add them with --arms ... tralo_null fioretto_null hounie_null alm_null.

datasets:
  dermmnist:
    data_dir: data/dermmnist/slice_1
    num_classes: 7
    group_column: loc_group     # HAM10000 anatomical site: real groups
    constrained_class: 4        # melanoma, 11.1% of test
  tissuemnist:
    data_dir: data/tissuemnist/slice_1
    num_classes: 8
    group_column: synth_group   # no group metadata -> fixed synthetic split
    constrained_class: 4        # GE (glomerular endothelial), 171/2400 = 7.1% of test
  octmnist:
    data_dir: data/octmnist/slice_1
    num_classes: 4
    group_column: synth_group
    constrained_class: 2        # drusen; class order is (CNV, DME, drusen, normal)

models: [MobileNetV3, MobileNetV2, RegNetY400MF, ViTB16]

# Keys that change WHAT THE WARM-UP OPTIMIZES. These and only these enter
# base_model_id, so two arms share a cached warm-up exactly when they should:
# `clip` and `lp` differ only in the allocator and reuse one trained model,
# while `focal_clip` trains its own because its objective differs. Anything that
# changes the warm-up and is missing here silently reuses the wrong model.
warmup_identity_keys:
  - lr
  - dropout
  - batch_size
  - warmup_epochs
  - pretrained
  - class_weighted_ce
  - seed
  - warmup_loss
  - focal_alpha
  - focal_gamma
  - cb_beta
  - logit_adjust_tau
