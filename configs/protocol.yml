protocol:
  total_epochs: 30
  trained_warmup: 1
  seeds:
  - 1
  - 2
  - 3
  - 4
core:
  lr: 0.0001
  dropout: 0.3
  batch_size: 64
  pretrained: true
constraint_phase:
  constraint_grad_clip: 1.0
  constraint_grad_mode: normalize
  constraint_fp32: true
  lr_constraint: 0.0001
  constraint_chunk_size: 128
blocks:
  tralo:
    lambda_step: 0.05
    lambda_global: 0.01
    lambda_local: 0.01
    initial_rho: 0.5
    rho_target: 100.0
  tralo_null:
    lambda_step: 0.0
    lambda_global: 0.0
    lambda_local: 0.0
    initial_rho: 0.5
    rho_target: 100.0
  fioretto:
    fioretto_step_size: 0.005
    fioretto_lambda_init: 0.0
  hounie:
    hounie_eta_lambda: 0.1
    hounie_eta_u: 0.1
    hounie_alpha: 1.0
  alm:
    alm_eta: 0.005
    alm_mu0: 0.01
    alm_mu_step: 0.01
    fioretto_lambda_init: 0.0
  focal:
    warmup_loss: focal
    focal_alpha: 0.25
    focal_gamma: 2.0
arms:
  tralo:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo
  tralo_null:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo_null
  clip:
    methodology: heuristic
    phase: posthoc
    blocks: []
  focal_clip:
    methodology: heuristic
    phase: posthoc
    blocks:
    - focal
  fioretto:
    methodology: fioretto_ldf
    phase: trained
    blocks:
    - constraint_phase
    - fioretto
  hounie:
    methodology: hounie_rcl
    phase: trained
    blocks:
    - constraint_phase
    - hounie
  alm:
    methodology: fioretto_alm
    phase: trained
    blocks:
    - constraint_phase
    - alm
mandatory_arms:
- clip
- focal_clip
datasets:
  iwildcam:
    data_dir: data/iwildcam/oodslice
    num_classes: 8
    group_column: location
    constrained_class:
    - 2
    - 7
    disjoint_groups: true
  fmow:
    data_dir: data/fmow/oodslice
    num_classes: 8
    group_column: location
    constrained_class:
    - 3
    - 5
    disjoint_groups: true
  bcn:
    data_dir: data/bcn/oodslice
    num_classes: 8
    group_column: location
    constrained_class:
    - 0
    - 2
    disjoint_groups: true
models:
- MobileNetV3
- MobileNetV2
- RegNetY400MF
- ViTB16
warmup_identity_keys:
- lr
- dropout
- batch_size
- warmup_epochs
- pretrained
- seed
- warmup_loss
- focal_alpha
- focal_gamma
