# THE PROTOCOL. Every value the generator emits comes from this file.
#
# gen_campaign.py contains NO experimental constants -- if a number decides what
# an experiment does, it is here. Two rules keep this honest, both enforced by
# `python -m scripts.audit_config`:
#
#   1. Every key emitted must be READ by the methodology it is emitted for.
#      A key the code never reads makes a config claim a knob that does not
#      exist (base_loss, rho_step and alpha_kl were each exactly that).
#   2. Every key the code reads must be EMITTED, never left to a default.
#      hounie_rcl's inline default is 0.1 while the paper says 0.01, so an
#      unset key silently ran a different method.
#
# Read sets are per methodology, so an arm carries its own block and nothing
# else: `lambda_step` on the fioretto arm would be hallucinated even though
# tralo reads it.

protocol:
  total_epochs: 30        # optimizer epochs, IDENTICAL both sides = equal compute
  trained_warmup: 1       # warm-up 50 saturates CE; warm-up 5 is a dead zone
  seeds: [1, 2, 3, 4]

# Emitted on EVERY arm and verified by scripts/check_parity.py. These four are
# the comparison contract itself, so they are written even where the training
# code does not read them (constraint_epochs: 0 states "this arm has no
# constraint phase", which is what makes equal compute checkable).
contract_keys: [warmup_epochs, constraint_epochs, seed, lr]

# Read by the shared warm-up for every methodology (src/pipeline/warmup.py,
# src/models/model_factory.py).
core:
  lr: 0.0001
  dropout: 0.3
  batch_size: 64
  pretrained: true
  class_weighted_ce: false

# Read only by methodologies that run a constraint phase.
constraint_phase:
  # The unit gradient clip on the constraint step. THIS is the treatment dose.
  # The raw constraint gradient norm is 2,560-12,400, so the clip discards
  # essentially all of the magnitude and delivers exactly this value -- which is
  # what makes the lambda ratchet and the rho ramp no-ops by construction. It
  # was hardcoded as 1.0 in four trainers, invisible to audit_config, while
  # protocol.yml claimed "if a number decides what an experiment does, it is
  # here". It is the only dose axis the protocol admits: lr_constraint is
  # locked equal to lr, and every magnitude knob below it is cancelled by this
  # clip. Sweep 0.3 / 1.0 / 3.0 to get a dose-response curve.
  constraint_grad_clip: 1.0
  # How the constraint gradient is BOUNDED. "clip" caps it at
  # constraint_grad_clip; "normalize" rescales it to EXACTLY that value.
  # MEASURED 2026-08-20, results/vit_diag seed 1 -- same warm-up model, and all
  # three configs saying constraint_grad_clip: 1.0:
  #     tralo     raw norm 0.638 .. 1826.5    clip binds  6 of 7
  #     fioretto  raw norm 17,667 .. 80,827   clip binds 18 of 18
  #     hounie    raw norm 0.005 .. 0.1105    clip binds  0 of 29
  # One absolute clip across three natural scales means tralo and fioretto each
  # deliver a unit-norm step while hounie delivers its raw ~0.05-norm step -- a
  # ~20x dose gap that NO config gate can see, because every config says 1.0.
  # "normalize" makes the constraint step size a protocol constant identical
  # across arms, leaving each method's DIRECTION as its actual contribution,
  # which is what the comparison is supposed to be about.
  constraint_grad_mode: clip
  # Evaluate the constraint pass in fp32 and bypass the loss scaler. fioretto
  # lost 10 of its 29 constraint epochs to non-finite gradients (6 NaN + 4 inf,
  # RAW count -- calling dropna() first hides the NaN and reports 4). It recurs
  # rather than settling because the 126 CE steps per epoch grow the loss scale
  # back up between constraint steps, and fioretto's constraint loss is ~1e4
  # times CE's. One backward per epoch, so the cost is small.
  constraint_fp32: false
  # Which rule takes the constraint step. "shared" uses the same Adam the CE
  # pass just took 126 steps with, which leaves cos(parameter update,
  # constraint gradient) at 0.009-0.017 -- the constraint step is ~98% a 127th
  # CE step. "sgd" takes p -= lr_constraint * g directly, recovering the
  # direction at a step of norm lr_constraint * ||g|| exactly.
  # NOT the rejected `separate_constraint_optimizer`: that used a dedicated
  # ADAM, whose 1/sqrt(v) makes the step ~lr*sqrt(N) -- roughly 8,900x larger
  # at ViT-B/16 scale -- so it confounded direction with a huge dose increase
  # and cost AP -0.0938. With constraint_grad_mode: normalize the step here is
  # exactly lr_constraint * constraint_grad_clip = 1e-4, the SMALLEST dose in
  # that sweep, with the direction fully recovered. Opposite corner.
  constraint_step_rule: shared

  # THE CONTROL FOR "DID THE DIRECTION MATTER?". Replaces the constraint
  # gradient with a random vector of the SAME norm, so the dose is held and
  # only the information is removed. It exists because the measured damage
  # looks direction-independent: on dermmnist multi-class the constraint
  # cost exactly 4 correct capped-class predictions out of 89 at every one
  # of three seeds (d capF1 -0.0149/-0.0150/-0.0149, sd 0.0001) while the
  # count trajectories behind those seeds ended at 57, 201 and 439. If a
  # random step of the same size costs the same 4, the penalty contributed
  # nothing a coin could not have.
  constraint_random_direction: false
  lr_constraint: 0.0001       # MUST equal core.lr -- unequal lr fabricated a -16.7pp finding
  stable_count_threshold: 31
  # 128, NOT 256. The constraint pass runs a BACKWARD over the test set, and
  # with `constraint_fp32: true` a chunk of 256 exhausts
  # the 24 GB Quadro RTX 6000 (dsisco01) on ViT-B/16: measured 2026-08-21,
  # all 8 `tralo` runs of `results/dosefix` died
  # of CUDA OOM at tralo/train.py's transductive forward, were reset to
  # `pending` by the dispatcher, and the campaign came back looking merely
  # unfinished with every CONTROL completed -- the lambda=0 arm survives
  # precisely because it skips that pass. Chunking partitions memory, not
  # mathematics: the accumulated gradient is a sum either way. The cost is a
  # few extra chunk boundaries on the two transductive passes per epoch, not
  # on the 126 CE steps, so it is negligible -- and it is paid on every
  # backbone rather than left as a landmine for the largest one.
  constraint_chunk_size: 128
  enable_checkpoint_restore: false

# Read by the arms that chunk a NO-GRAD forward pass: the post-hoc allocators,
# and `select`'s test-set count. A DIFFERENT KEY from the constraint phase's
# `constraint_chunk_size` on purpose. They are two knobs, and while they shared
# a name `check_parity` read the campaign as broken -- it compares a key across
# the arms that carry it, so the allocators' 256 and the constraint phase's 128
# looked like one setting disagreeing with itself. They are not comparable:
# the constraint chunk bounds a backward pass (which is why ViTB16 + fp32 OOMs
# at 256), this one bounds inference under no_grad and costs almost nothing.
chunked:
  inference_chunk_size: 256

blocks:
  tralo:
    lambda_step: 0.05
    lambda_global: 0.01       # initial lambda, global scope
    lambda_local: 0.01        # initial lambda, local (per-group) scope
    # The per-scope penalty shape. "rational_bounded" is the manuscript's Eq. 4
    # and stays the DEFAULT -- changing it would silently reinterpret every
    # stored result. "linear" (E/K) and "squared" ((E/K)^2) exist because the
    # bounded shape's gradient is NON-MONOTONE in the violation above rho ~ 1:
    # near zero at the boundary, peaking around 53-58% over, decaying toward zero
    # for anything worse, so a scope 8x over budget gets 167x LESS pull than one
    # 58% over. With ONE term that cancels (scalar x fixed direction, divided out
    # by the clip). With several it sets their relative weights, backwards.
    # MEASURED on a real multi-class run 2026-08-20 (dermmnist, classes 2+4,
    # L30_G20, 4 epochs): class 4 at 1.3x budget was pulled to 57 against K=45,
    # while class 2 at 9.3x budget ROSE to 410 against K=44 and was never
    # touched. Single-class spread across scopes has median 1.5x; this is ~30x,
    # which is why multi-class is where the shape stops being inert.
    penalty_shape: rational_bounded
    # ^ TraLO-SPECIFIC on purpose: the duals do not have this penalty at all
    # (fioretto sums probabilities, hounie uses a mean violation), so a
    # shared-block key would be emitted to them and read by none of them --
    # audit_config flagged exactly that, 6 arms, before this moved here.
    initial_rho: 0.5
    rho_target: 100.0         # rho_step is DERIVED from this; a config rho_step is ignored
    # WHERE THE COUNT PUTS ITS GRADIENT. `sum` is the manuscript's count
    # s_c = sum_i p_ic, whose per-item derivative is p(1-p). At the K-th RANKED
    # item that is 0.026 at L30_G20 (0 of 4 seeds responded) vs 0.055 at
    # L50_G30 (4 of 4), and 0.0009 once CE has converged -- which is what "CE
    # saturates" means and why warm-up 50 is a dead regime.
    #
    # WARNING: rank K is NOT the decision boundary. When the hard count is 300
    # against K = 44 the boundary is at item 300 and rank 44 is buried inside
    # the class; at the boundary p(1-p) is near its MAXIMUM and `sum` already
    # puts 29.4% of its gradient on the 20 items nearest it. So the margin
    # window buys less than "the gradient cannot reach the cut" implies --
    # at most 1.30x on the items that must flip. FRAMEWORK section 4.
    #
    # `margin` keeps the count and moves its weight: it replaces p_ic with
    # sigmoid((p_ic - max_{c' != c} p_ic')/T) -- the softened ARGMAX -- whose
    # derivative peaks at the DECISION BOUNDARY, on the items one step from
    # flipping. Summed it tracks the HARD count rather than the probability
    # mass, so it is also the tighter relaxation. It is a function of an item's
    # own row, so it needs no order statistic and the chunked construction
    # still gives the exact full-N gradient.
    #
    # NOT an order statistic. Centring the window on the K-th largest
    # probability is the obvious version and it is DEAD: it counts how many
    # items exceed the K-th largest, which is K-0.5 for any model whatsoever.
    # A constant, so relu(s-K) is identically zero and it produces no gradient
    # at all. Wired into the trainer, caught by the chunked-gradient test
    # before it reached a GPU. A soft count must be able to EXCEED the budget.
    soft_count_mode: sum
    cut_window_items: 5       # ONLY read when soft_count_mode: margin. A DOSE.
    # Declared here as well as in `tralo_ortho` so the trainer's inline
    # default has a protocol value to agree with. Every arm but
    # `tralo_ortho` runs the unprojected step, and an inline default
    # that no protocol key confirms is how a knob silently diverges
    # from what the configs claim.
    ortho_project: false
    # Same reason as ortho_project: the base value is declared so the
    # trainer's inline default has a protocol key to agree with.
    head_only: false
    # WHAT THE PENALTY READS. false = the soft count's own value, which is the
    # manuscript. true = the HARD count, with the soft count supplying only the
    # gradient (straight-through, free from the chunked detach construction).
    #
    # SEPARATE FROM soft_count_mode ON PURPOSE. Two different defects: the
    # count's VALUE (sum_i p_ic tracks probability mass, not the hard count --
    # on a toy it moved the count AWAY from the budget, 35 against a lambda=0
    # control's 31) and the gradient's PLACEMENT (p(1-p) vs the margin window).
    # Measured on the stored evidence, placement is worth at most 1.30x on the
    # items that must actually flip, so an effect much larger than that is the
    # value fix and not the window. Bundled, they are unattributable.
    straight_through: false
    # ^ sweep {2, 5, 10, 20}. Measured GPU-free on the stored evidence (160
    # (class, cell) points, 3 datasets, end-of-run predictions), share of each
    # count's gradient landing on the 20 items nearest the DECISION BOUNDARY:
    #   sum 29.4% | margin at 2 items 96.1%, 5 -> 82.3%, 10 -> 45.5%,
    #   20 -> 13.3%, 40 -> 3.7%. The crossover is between 10 and 20, so a wide
    # window is WORSE-targeted than the plain count, not better: at 40 items
    # the derived T is 0.18-0.57 and the sigmoid is flat over the whole margin
    # range. Narrow concentrates but raises variance -- at 2 items the step
    # direction is set by two items and `normalize` scales that to unit norm.
    # ^ the sigmoid width T is DERIVED from this, per class, per epoch, so the
    # window always holds this many items. A fixed T is not a fixed dose:
    # measured on the stored dermmnist evidence, the T holding ~20 items spans
    # 0.182 .. 0.502 ACROSS SEEDS OF ONE CELL, and T = 0.02 -- a plausible
    # guess -- puts 0 to 3 items in the window, i.e. the constraint does
    # nothing and the run reports a null while writing `completed`. Same
    # defect `constraint_grad_mode: normalize` fixes on the other axis.
    #
    # It moves ONLY where the gradient lands, never what the count says: the
    # penalty reads the HARD count via the chunked construction's own detach
    # (value hard, gradient windowed). Without that the window over-counts and
    # the penalty keeps pushing after the cap is satisfied.
    #
    # THE RNG-STREAM PERTURBATION. false on every arm except `tralo_reseed`,
    # which is the deliberate version of the reseed control (see its block
    # below). Emitted rather than left to the code's default for the same
    # reason `constraint_random_direction: false` is emitted: a key read with a
    # default and never written is a knob whose value lives in a literal, and
    # this file's rule 2 exists because hounie ran at 10x the paper's eta that
    # way.
    rng_reseed: false
  # The margin count, as an ARM rather than a global override, so it and the
  # manuscript's count can sit in ONE campaign. An arm-vs-arm delta is not a
  # result until the bar is in the same campaign, and that applies to two
  # estimators of the same constraint exactly as it applies to two methods.
  # THE COIN. Same step NORM, no information -- the direction is replaced by a
  # random vector. One coin serves every trained arm: the randomisation happens
  # after the gradient is formed, so which count produced it is irrelevant.
  # It is an ARM and not the campaign-wide --constraint-random-direction flag
  # because that flag randomises EVERY arm, which means the coin can never sit
  # in the same campaign as the thing it controls -- and an arm-vs-arm delta is
  # not a result until the bar is in the same campaign.
  tralo_coin:
    constraint_random_direction: true
  tralo_st:
    straight_through: true
  tralo_margin:
    soft_count_mode: margin
    straight_through: true
  # THE ORDER-PRESERVING COUNT. Measured 2026-08-24 with scripts/order_probe:
  # against its own lambda=0 twin the shipped count moves 73 items per cell and
  # the ones it pushes OUT of the budget are true positives 68.8% of the time
  # while the ones it pulls IN are 30.1% -- net -30.4 items, 16/16 cells. The
  # reseed control moves a comparable 63 items and nets +0.38, so that is the
  # constraint choosing, not noise. `uniform` keeps the count's VALUE exact and
  # makes its per-item gradient constant in log-odds, which is a pure bias
  # shift and cannot reorder. straight_through is NOT required: the value is
  # already exactly sum_i p_ic, so pass 1 stays correct either way.
  tralo_uniform:
    soft_count_mode: uniform
  # THE CUT-WINDOWED COUNT (FRAMEWORK 2(z12)). The shipped count's per-item
  # derivative p(1-p) is MAXIMAL at p=0.5 and VANISHING at p=1, and on iwildcam
  # at tight caps the K-th ranked item -- the cut, the only place where moving
  # an item changes the emitted top-K set -- sits at p=0.99984 to 1.00000.
  # Measured on real stored features, the fraction of total gradient mass on
  # the 40 items straddling the cut is 0.0001 for `sum`, 0.0136 for `uniform`,
  # and EXACTLY 0.0000 for `margin` (which windows the BOUNDARY, not the cut --
  # the conflation CLAUDE.md rule 3 warns about). This puts 0.35 there.
  #
  # straight_through is NOT required, for `uniform`'s reason: the value is
  # already exactly sum_i p_ic, so pass 1 stays correct either way.
  #
  # `cut_window_items` sets the window width in ITEMS. At a fixed temperature
  # the mass at the cut collapses 0.830 -> 0.111 between two classes of the
  # SAME run, so a fixed temperature is not a fixed dose.
  #
  # NOT PREDICTED TO WIN, and this is pre-registered so it cannot be rewritten
  # afterwards: aiming at the cut is NECESSARY, not sufficient. At tight caps
  # the clipper's selected set is already 99.6% correct and `headroom` reads
  # 0.0-1.0 items, so a correctly-aimed gradient can still find nothing to
  # take.
  #
  # WHAT IS PREDICTED, and read it on the right quantity. An earlier version of
  # this comment said "the count trajectory responds where `sum` measurably
  # cannot". THAT WAS WRONG and is FRAMEWORK 2(z13): `sum` already moves the
  # hard count 4.02x / 2.94x the reseed floor at tight caps, because the HARD
  # COUNT is a DECISION-BOUNDARY readout and the boundary is exactly where
  # p(1-p) peaks. It cannot test a claim about the CUT -- CLAUDE.md rule 3.
  #
  #   -> `tralo_cut` moves the EMITTED top-K set at tight caps by more,
  #      relative to the `tralo_reseed` floor, than `tralo` does. Read it from
  #      `boundary_probe --control tralo_null` on `final_predictions.csv`, in
  #      net items -- never from the hard count.
  #   -> its HARD count should move LESS than `tralo`'s, not more, because this
  #      window deliberately takes gradient OFF the boundary.
  tralo_cut:
    soft_count_mode: cut
    cut_window_items: 40
  # THE CE-ORTHOGONAL ARM. The constraint gradient is projected onto the
  # orthogonal complement of the last CE minibatch gradient, so enforcing the
  # cap cannot undo the CE progress just made. Direction only: the projection
  # runs BEFORE the norm bound, so under `constraint_grad_mode: normalize` the
  # delivered step is exactly `constraint_grad_clip` for this arm and for
  # `tralo`, and they differ in nothing else.
  #
  # WHY IT IS BACK. FRAMEWORK 2(s) measured that the constraint's damage to the
  # six uncapped classes does NOT arrive through the output layer -- the
  # softmax cross-term perturbs those logits and provably cannot reorder them,
  # zero flips across a 50x dose range. It arrives through the SHARED BACKBONE,
  # which is what this projection acts on.
  #
  # 2(t) recovered what was actually run before: 8 runs, one cell, dermmnist x
  # MobileNetV3 x L30_G30, no clipper in the campaign, zero surviving
  # predictions -- and AP +0.0041 in its favour, under a checkpoint selector
  # biased against it. It was filed as rejected without a verdict.
  #
  # 🛑 LIVENESS FIRST: `python -m scripts.flag_live tralo tralo_ortho`. An
  # inert flag is this project's most frequent defect and this one has no
  # surviving predecessor to audit against.
  tralo_ortho:
    ortho_project: true
  # THE POSITIVE CONTROL FOR `tralo_ortho`, and the sharper test of the
  # hypothesis behind it. FRAMEWORK 2(s) concluded the constraint's damage to
  # the uncapped classes arrives through the SHARED BACKBONE. `tralo_ortho`
  # tries to fix that by projecting the step off the CE direction; this arm
  # tests the hypothesis outright by confining the constraint gradient to the
  # classifier head, so no constraint INFORMATION reaches the backbone.
  #
  # NOT 'the backbone cannot move under it at all' -- that is false and this
  # comment said it until 2026-09-01. Masking a gradient does NOT freeze the
  # parameter: Adam's stale CE momentum still steps a masked coordinate at
  # 90.4% of an unmasked one (`scripts.ortho_survival`). The backbone keeps
  # moving; it just stops hearing the constraint.
  #
  # WHY BOTH. An `ortho` null alone is unattributable -- it could mean the
  # projection is too weak OR that the backbone was never the culprit. Run
  # beside this arm the two cases separate: if `head_only` also nulls, the
  # backbone hypothesis is dead and the damage is intrinsic to training under
  # a count penalty; if `head_only` recovers and `ortho` does not, the
  # projection is the wrong instrument for a real effect.
  #
  # ⚠️ CE STILL TRAINS THE WHOLE MODEL. Only the CONSTRAINT step is confined,
  # so the 29 epochs of CE that produce the +0.0145 compute term are untouched
  # and this arm keeps them.
  #
  # ⚠️ AND IT DELIVERS THE WHOLE STEP NORM TO THE HEAD, by the same
  # `normalize`-after-masking rule that keeps every other arm at one dose. So
  # it answers "does confining the constraint to the head remove the damage",
  # NOT "does freezing the backbone help, all else equal".
  #
  # SIZE THAT, because the head is small. Measured on the real backbones, the
  # identified head is weight + bias only:
  #     MobileNetV3    10,248 / 4,212,280   0.243%
  #     MobileNetV2    10,248 / 2,234,120   0.459%
  #     RegNetY400MF    3,528 / 3,906,672   0.090%
  #     ViTB16          6,152 / 85,804,808  0.007%
  # so the same total norm lands on 0.09-0.46% of the parameters in this
  # campaign's three backbones -- a per-parameter step two to three orders
  # larger than `tralo` delivers there. Holding the per-parameter step instead
  # would make this arm's TOTAL step far smaller than its control's, which
  # breaks the one thing `constraint_grad_mode: normalize` exists to hold
  # fixed and would fail `check_parity`. The convention is total norm; the
  # consequence is stated here so it is read with the result and not
  # discovered in it.
  tralo_head:
    head_only: true
  # THE EQUAL-DOSE CONTROL FOR EVERY HEAD-TO-HEAD. Measured 2026-08-30 on dom1
  # and dom1b: `tralo` and `alm` attempt 29 constraint steps per run while
  # `fioretto` and `hounie` attempt 28, at an identical `constraint_epochs: 29`
  # -- and `dose_landed` printed 100.0% for all four, because that figure is
  # applied/attempted WITHIN an arm.
  #
  # Verified at the GRADIENT level, so it is dose and not accounting. The
  # subgradient duals guard their step on `has_work` (is any lambda > 0) and
  # update the dual at the END of the epoch, so their first constraint epoch
  # does nothing: logged `grad_norm` is exactly 0.0 at epoch 1 for both. TraLO
  # guards on `has_constraint`, which is structural, and starts at
  # lambda_global 0.01, so it takes a real step at epoch 1 (`Grad_Norm` 3.09).
  #
  # That is faithful to the published algorithms -- lambda^0 = 0 is what
  # subgradient dual ascent specifies -- so it must NOT be fixed by hacking a
  # baseline. It is fixed by giving TraLO the same start and seeing whether the
  # win survives. This arm is `tralo` with lambda initialised to 0 and the
  # ratchet UNCHANGED (`lambda_step` stays 0.05), so epoch 1 carries a zero
  # gradient exactly as the duals' does, the ratchet lifts lambda at the end of
  # it, and epochs 2..29 run normally -- 28 effective steps, matching them.
  #
  # It is NOT `tralo_null`: the null zeroes `lambda_step` too, so lambda stays 0
  # forever and no constraint is ever applied. Here only the STARTING value is
  # 0. Read `Lambda_Global` in the log to tell them apart -- it must rise here
  # and stay flat in the null.
  tralo_lam0:
    lambda_step: 0.05
    lambda_global: 0.0
    lambda_local: 0.0
  # THE NULL-TREATMENT CONTROL. Identical to `tralo` in warm-up length, optimizer
  # restart, epoch count, transductive passes and allocator -- with the treatment
  # removed. total_constraint == 0 makes has_constraint False, so pass 2 is
  # skipped entirely, and the ratchet adds lambda_step = 0 so lambda stays 0
  # forever.
  #
  # Why it has to exist: the ten arms split into six post-hoc arms with ZERO
  # test-set access during training and four trained arms with 29 transductive
  # epochs plus a fresh Adam plus a count gradient. Nothing separates those, so
  # the tralo-vs-clip delta bundles four things at once -- the count gradient,
  # the optimizer restart (a measured 3.72x step-size kick), 29 epochs of
  # transductive forward/backward, and a 2.7-22.3% compute excess. The project's
  # own most-quoted fact is that REGIME beats METHOD by ~80x, and until this arm
  # runs there is no measurement that separates them.
  tralo_null:
    lambda_step: 0.0
    lambda_global: 0.0
    lambda_local: 0.0
    initial_rho: 0.5
    rho_target: 100.0
    rng_reseed: false
  # THE RESEED CONTROL -- the NOISE FLOOR under every count trajectory.
  #
  # It carries `tralo_null`'s block and overrides ONE key, so it is that arm by
  # construction and cannot drift from it: same warm-up cache, same 29 epochs,
  # same allocator, lambda identically 0 so `has_constraint` is False and no
  # constraint step is ever taken. The only difference is that the CE phase
  # consumes a DIFFERENT RNG stream -- one extra draw from the global generator
  # before training, and nothing else.
  #
  # WHY IT IS AN ARM AND NOT AN ACCIDENT. Measured on `results/dosefix`
  # 2026-08-22 and independently verified -- RMS separation of the capped-class
  # hard count over epochs >= 4:
  #
  #     the constraint (tralo vs its own lambda=0 twin)  75.6 / 85.3  @L40_G30
  #     the constraint (tralo vs its own lambda=0 twin)  74.6 / 95.2  @L50_G30
  #     nothing but the RNG stream (two pure-CE runs)    82.8 / 95.0
  #
  # The constraint's whole measurable footprint on the count is 0.90-1.00x a
  # reseed. That floor existed only because `select_null` sets `select_eta: 0`
  # and its selection head draws from the global RNG -- a pure-CE run on
  # `tralo_null`'s seed and warm-up cache, differing only in the stream. Nobody
  # had put a reseed control in a campaign; the noise floor was in the data by
  # accident. "The constraint moved the count 75 items" is not a result until
  # it is stated as "the constraint moved it 75 and a reseed moves it 83", so
  # gen_campaign REFUSES a campaign that holds a trained arm without this one.
  # FRAMEWORK section 13.
  tralo_reseed:
    rng_reseed: true            # exactly ONE draw. Every reseed run in the
                                # corpus was produced this way and must keep
                                # reproducing bit-for-bit, so this stays `true`
                                # and never becomes `1` cosmetically.
  # A SECOND, INDEPENDENT RNG REPLICATE (2026-09-04, FRAMEWORK 2(z41)).
  # `rng_reseed` is a DRAW COUNT, and each count is a distinct stream, so this
  # is a third lambda=0 model differing from `tralo_null` and `tralo_reseed`
  # in the RNG and nothing else.
  #
  # WHY IT IS WORTH 8 RUNS. The RNG floor every arm-vs-arm claim is judged
  # against comes from `_null` vs `_reseed` pairs, and a campaign carries
  # exactly one such pair at 4 seeds -- a median of FOUR numbers, whose
  # order-statistic CI is the whole sample range. `sensitivity_screen` refuses
  # to decide below eight, which is why 36 of 38 corpus cells read
  # UNDER-POWERED rather than NOT DIFFERENTIATED. Three lambda=0 variants give
  # C(3,2) = 3 pairs x 4 seeds = 12 observations.
  #
  # ⛔ MORE `<family>_reseed` ARMS WOULD BUY NOTHING: lambda=0 makes them all
  # plain CE, so an `alm_reseed` is byte-identical to `tralo_reseed`. Distinct
  # STREAMS are the only thing that adds observations.
  tralo_reseed2:
    rng_reseed: 2
  # THE DELIVERY FIX (2026-09-06). `constraint_step_rule` decides whether the
  # constraint step goes through the SAME Adam that CE is using (`shared`, the
  # protocol default) or as a plain SGD step on its own (`sgd`).
  #
  # WHY IT IS WORTH AN ARM. Measured by scripts/ortho_survival: under `shared`
  # 92.6% of each delivered update is stale CE momentum the constraint never
  # touched, and `sqrt(v)` rescales the rest per-coordinate -- so a count
  # function rotated a full 180 degrees arrives at the weights as 9.1 degrees.
  # That is the standing explanation for the project's most uncomfortable
  # result: `tralo_coin`, a RANDOM step of the same norm, is within the RNG
  # floor of `tralo` in 4 of 4 cells. If the direction never arrives, every
  # arm that differs only in direction must tie, and eleven of them have.
  #
  # PRE-REGISTERED, so it cannot be rewritten after the fact:
  #   -> `tralo_sgd` vs `tralo` is the DELIVERY contrast. It may go either
  #      way; plain SGD at `lr_constraint` is a smaller effective step than
  #      Adam's normalised one, so a null here is `dose`, not `mechanism`.
  #   -> The claim this arm exists to test is NOT `tralo_sgd > tralo`. It is
  #      that `tralo_sgd` - `tralo_coin_sgd` EXCEEDS `tralo` - `tralo_coin`:
  #      i.e. that direction matters MORE once it is delivered. Read that
  #      difference-in-differences, never the headline.
  #
  # NOT in `warmup_identity_keys`, correctly: it touches the constraint phase
  # only, so this arm SHARES `tralo`'s cached warm-up and differs from it in
  # exactly one key. That is what makes the contrast clean and cheap.
  sgd_step:
    constraint_step_rule: sgd
  # THE PENALTY SHAPES, AND WHY THEY ARE FINALLY WORTH AN ARM (2026-09-06).
  #
  # The shipped `rational_bounded` is BOUNDED in the excess, so its slope
  # d(pen)/dE is NON-MONOTONE: near 1/s at the boundary, peaking ~53-58%
  # over, and decaying toward zero for anything deeper. With a SINGLE term
  # that is harmless -- the constraint gradient is normalised as a whole, so
  # the shape is a scalar times a fixed direction and divides out. With
  # SEVERAL terms it sets their RELATIVE weights, and it sets them backwards:
  # the deepest violator is the one it starves.
  #
  # THAT WAS ALGEBRA UNTIL NOW, AND IT WAS DEMONSTRATED ON THE WRONG DATASET.
  # FRAMEWORK 2(a2) established the shape on dermmnist, which is removed, leaks
  # 38.7% of its test set, and whose LOCAL scope was EMPTY (`lp_fallback_used`
  # False with 0 candidates on all 52 runs). So the many-term case barely
  # existed where the effect was shown.
  #
  # MEASURED ON iwildcam 2026-09-06 by `scripts/penalty_starvation`, from
  # training_log.csv alone, 232 epochs over 8 `dom1` runs:
  #   ELEVEN live scopes per epoch
  #   deepest violated 29.8x its budget, median 0.19x -- a SPREAD of 147x
  #   the deepest scope is pulled 0.075x (rho=0.5) to 0.014x (rho=100) as
  #   hard as the median one, i.e. 13-71x BACKWARDS
  # `linear` reads 92x and `squared` 3926x on the same epochs.
  #
  # WHY IT MIGHT BE THE alm GAP. An augmented Lagrangian grows its pull with
  # violation depth without bound; this shape shrinks it. `alm` leads TraLO on
  # the deployed head-to-head, and this is a structural difference between
  # them rather than a tuning one.
  #
  # PRE-REGISTERED, so it cannot be rewritten afterwards:
  #   -> the prediction is about the DEEPLY-VIOLATED scopes specifically, so
  #      read `Group*_Hard_Class*` against `Group*_Limit_Class*` per scope,
  #      not the campaign headline. A shape that fixes the weighting and does
  #      not move deployed TP is still informative and must be reported.
  #   -> `squared` is UNBOUNDED and iwildcam has 7 zero-K ceilings where the
  #      scaled excess `e` can be large, so it is the more likely of the two
  #      to destabilise. If it collapses and `linear` does not, that is the
  #      expected ordering, not a surprise.
  #   -> NOT predicted to win outright. Aiming the weights correctly is
  #      necessary, not sufficient: `headroom` still bounds the whole prize.
  #
  # Neither is in `warmup_identity_keys` -- both touch the constraint phase
  # only -- so both SHARE `tralo`'s cached warm-up and differ from it in
  # exactly one key.
  #
  # ---------------------------------------------------------------------
  # SUPERSEDED 2026-09-06, BEFORE shape1's RESULTS WERE READ. The text above
  # is kept verbatim as the record of what was originally predicted; this is
  # the correction. `scripts/deep_scope` measured the OUTCOME of the
  # starvation on `dom1` -- 178 violated scopes over 24 cell(seed)s, with the
  # post-hoc `clip`/`lp` carried as zero-constraint REFERENCE arms -- and the
  # prediction above is refuted in its stated form:
  #
  #   net of the reference, DEEP scopes are `alm` +12.7 vs `tralo` +12.3,
  #   i.e. TIED, and the ENTIRE `alm` advantage sits at MIDDLE depth
  #   (0.19-1.00 over budget): +11.3 vs +6.6, a 4.7-item gap.
  #
  # TraLO already closes its deepest scopes as well as ALM does, and 83% of
  # that deep bucket is the K=0 ceilings anyway. So:
  #   -> `squared` up-weights the DEEP bucket, which is already closed. It is
  #      now predicted to be UNINFORMATIVE OR HARMFUL and is retained as the
  #      CONTROL that discriminates the two stories, not as a candidate.
  #   -> `linear` up-weights middle and deep relative to shallow at
  #      `initial_rho`, and the middle bucket is where the gap actually is,
  #      so `linear` is the arm carrying the live prediction.
  #   -> if NEITHER moves the middle bucket, the penalty shape closes as a
  #      direction and the `alm` gap is somewhere else entirely.
  # FRAMEWORK 2(z48).
  # ---------------------------------------------------------------------
  penalty_linear:
    penalty_shape: linear
  penalty_squared:
    penalty_shape: squared
  fioretto:
    fioretto_step_size: 0.005     # REQUIRED: fioretto_ldf/train.py raises without it
    # Emitted here as well as on `alm`. Both packages READ this key, and ALM's
    # docstring says the two arms differ in the DUAL UPDATE only -- so leaving
    # it to a code default on this side means sweeping it from the generator
    # moves ALM's multipliers and not LDF's, which is the same half-applied
    # asymmetry in its config form. audit_config reports it as "silent".
    fioretto_lambda_init: 0.0
  # Zero dose. lambda inits at 0.0 and only step_size moves it, so the primal
  # term is never added (gated `if lambda_g[c] > 0`, fioretto_ldf/train.py:251).
  fioretto_null:
    fioretto_step_size: 0.0
    fioretto_lambda_init: 0.0
  hounie:
    # arXiv:2306.02426 (Hounie, Ribeiro, Chamon), App. F: "dual learning rate
    # eta_lambda = 0.1 ... and a perturbation learning rate eta_u = 0.1", with
    # "a quadratic penalty on the perturbation h(u) = ||u||^2_2", i.e. alpha=1.
    # App. G's ablation grid for eta_lambda is {0.1, 0.5, 1, 2} and it reports
    # "the rates that were used in the paper (eta_u = 0.1, eta_lambda = 2)".
    # 0.01 appears NOWHERE in the paper as a rate.
    #
    # We shipped 0.01 / 0.01 / 10.0 until 2026-08-23. That triple keeps the
    # paper's u-contraction |1 - 2*eta_u*alpha| = 0.8 exactly, so the SHAPE of
    # the perturbation dynamics was faithful -- but u* = lambda/(2*alpha), so a
    # 10x smaller lambda times a 10x larger alpha made the relaxation ~100x
    # smaller than the paper's, and the resilient term could not reach the
    # model: alpha swept 0.05 -> 10.0 emitted BIT-IDENTICAL predictions.
    # At the values below the same 200x sweep emits three distinct prediction
    # sets, so `hounie_alpha` is live and the arm measures the method it names.
    hounie_eta_lambda: 0.1
    hounie_eta_u: 0.1
    hounie_alpha: 1.0
  # Zero dose. eta_u is deliberately NOT zeroed: hounie_rcl/train.py:85 refuses
  # abs(1 - 2*eta_u*alpha) >= 1.0, and eta_u=0 gives exactly 1.0, so the arm
  # would raise. eta_u moves only the slack u, which cannot reach the primal
  # once lam is pinned at its 0.0 init.
  hounie_null:
    hounie_eta_lambda: 0.0
    hounie_eta_u: 0.1
    hounie_alpha: 1.0
  alm:
    alm_eta: 0.005
    alm_mu0: 0.01
    alm_mu_step: 0.01
    fioretto_lambda_init: 0.0
    enable_checkpoint_restore: false
  # Zero dose. mu0 MUST be zeroed with the rest: the weight is
  # lambda + mu_t*r+ with mu_t = mu0 + mu_step*epoch, so leaving mu0 at 0.01
  # gives a live augmentation -- a weak treatment wearing a control's name.
  alm_null:
    alm_eta: 0.0
    alm_mu0: 0.0
    alm_mu_step: 0.0
    fioretto_lambda_init: 0.0
    enable_checkpoint_restore: false
  focal:
    warmup_loss: focal
    # focal_alpha is DEAD as implemented. imbalanced_losses.py multiplies the
    # WHOLE loss by alpha rather than using Lin et al.'s per-class balancing
    # factor alpha_t, and Adam is scale-invariant, so a 10,000x change in alpha
    # leaves argmax agreement at 1.0000 and the max logit delta at 5.8e-07.
    # (Under plain SGD the same change moves 46% of predictions, so the loss
    # genuinely differs -- it is Adam that cancels it.) focal_gamma IS live:
    # gamma=5 gives 0.9531 agreement against gamma=2.
    #
    # Left at the paper's value so the config still documents intent, but this
    # arm is gamma-only focal loss, and the manuscript should say so or the
    # implementation should take a per-class alpha_t.
    focal_alpha: 0.25
    focal_gamma: 2.0
  class_balanced:
    warmup_loss: class_balanced
    cb_beta: 0.9999
  logit_adjust:
    warmup_loss: logit_adjust
    logit_adjust_tau: 1.0

# `phase: posthoc`  -> warm-up total_epochs, constraint 0 (the warm-up IS the run)
# `phase: trained`  -> warm-up trained_warmup, constraint total_epochs - trained_warmup
  # ---- 1c: the jointly-trained SELECTION head -------------------------------
  # ⛔ REJECTED 2026-08-22 (docs/FRAMEWORK.md section 12). `results/selectrun`,
  # 32 runs: -22 items vs `clip`, 0 of 2 cells on EVERY metric, and 2 of 8 runs
  # collapsed on their final epoch. `select_null` (eta 0) ties `clip`, so it is
  # the selective term that costs, not the regime. DO NOT re-tune `select_eta`,
  # `select_cov_weight` or the coverage target: the values below are kept so
  # that campaign stays reproducible, not as a starting point for a sweep.
  # Deliberately NOT given the `constraint_phase` block. This arm has no
  # constraint step at all -- no gradient clip, no step rule, no dual -- so
  # inheriting those ten keys would emit eight that nothing reads, which is
  # exactly what audit_config exists to catch.
  select:
    lr_constraint: 0.0001     # MUST equal core.lr, same rule as every other arm
    # Weight on the selective term against CE. At 0 this arm IS its own null,
    # which is what `select_null` sets.
    select_eta: 1.0
    # Pull toward the coverage target. 32.0 is SelectiveNet's published value
    # (Geifman & El-Yaniv, ICML 2019); it is their number, not a tuned one, and
    # is recorded as such so it is never reported as a fitted hyperparameter.
    select_cov_weight: 32.0
    # Smoothing for the running coverage estimate. Our coverage target is
    # K_c/n_test ~ 0.03 against SelectiveNet's 0.70-1.00, so a batch of 64 holds
    # only ~2 covered items and a per-batch coverage penalty sits on its own
    # noise floor. The VALUE of the penalty therefore comes from this running
    # estimate while the GRADIENT still comes from the current batch. 0.9 is
    # ~10 batches of memory, i.e. ~20 covered items -- enough to be a signal,
    # short enough to track the head as it moves.
    select_cov_ema: 0.9
  # Zero dose. Same code path, same optimizer, same coverage targets computed
  # and logged -- only the selective term is switched off, so any difference is
  # the term and not the arm's extra machinery.
  select_null:
    lr_constraint: 0.0001
    select_eta: 0.0
    select_cov_weight: 32.0
    select_cov_ema: 0.9


arms:
  clip:       {methodology: heuristic,      phase: posthoc, blocks: []}
  focal_clip: {methodology: heuristic,      phase: posthoc, blocks: [focal]}
  lp:         {methodology: danits_lp,      phase: posthoc, blocks: [chunked]}
  focal_lp:   {methodology: focal,          phase: posthoc, blocks: [chunked, focal]}
  cb_lp:      {methodology: class_balanced, phase: posthoc, blocks: [chunked, class_balanced]}
  la_lp:      {methodology: logit_adjust,   phase: posthoc, blocks: [chunked, logit_adjust]}
  tralo:      {methodology: tralo,          phase: trained, blocks: [constraint_phase, tralo]}
  # Same everything, one key different: WHERE the count puts its gradient.
  # Shares `tralo_null` as its control -- at lambda 0 there is no constraint
  # gradient at all, so the choice of soft count is inert and a second null
  # would be a bit-identical run costing a full GPU slot.
  # The 2x2 minus its useless corner. `tralo` is (soft value, p(1-p) placement)
  # = the manuscript; `tralo_st` fixes only the VALUE; `tralo_margin` fixes both.
  # The fourth corner -- margin placement on a soft value -- over-counts (56.6
  # against a hard 45) and pushes past feasibility, which is measured and is the
  # joint arm's failure mode, so it is not an arm.
  tralo_coin:
    {methodology: tralo, phase: trained, blocks: [constraint_phase, tralo, tralo_coin],
     null_sibling: tralo_null}
  tralo_st:
    {methodology: tralo, phase: trained, blocks: [constraint_phase, tralo, tralo_st],
     null_sibling: tralo_null}
  tralo_margin:
    {methodology: tralo, phase: trained, blocks: [constraint_phase, tralo, tralo_margin],
     null_sibling: tralo_null}
  tralo_uniform:
    {methodology: tralo, phase: trained, blocks: [constraint_phase, tralo, tralo_uniform],
     null_sibling: tralo_null}
  tralo_cut:
    {methodology: tralo, phase: trained, blocks: [constraint_phase, tralo, tralo_cut],
     null_sibling: tralo_null}
  # THE DELIVERY ARMS. See the `sgd_step` block for the pre-registration.
  # Both share `tralo_null`: at lambda 0 there is no constraint step at all,
  # so the step RULE is inert and a separate null would be a bit-identical
  # run costing a GPU slot.
  tralo_sgd:
    {methodology: tralo, phase: trained,
     blocks: [constraint_phase, tralo, sgd_step],
     null_sibling: tralo_null}
  # The coin AT SGD DELIVERY -- the other half of the difference-in-differences.
  # Without it `tralo_sgd` measures a dose change and nothing else.
  tralo_coin_sgd:
    {methodology: tralo, phase: trained,
     blocks: [constraint_phase, tralo, sgd_step, tralo_coin],
     null_sibling: tralo_null}
  # THE PENALTY-SHAPE ARMS. See the `penalty_linear` block for the
  # measurement and the pre-registration. Both share `tralo_null`: at
  # lambda 0 there is no penalty term at all, so its shape is inert and a
  # separate null would be a bit-identical run costing a GPU slot.
  tralo_linear:
    {methodology: tralo, phase: trained,
     blocks: [constraint_phase, tralo, penalty_linear],
     null_sibling: tralo_null}
  tralo_squared:
    {methodology: tralo, phase: trained,
     blocks: [constraint_phase, tralo, penalty_squared],
     null_sibling: tralo_null}
  # Shares `tralo_null` for the usual reason: at lambda 0 with lambda_step 0
  # there is no constraint gradient, so a dedicated null would be a
  # bit-identical run costing a GPU slot.
  tralo_lam0:
    {methodology: tralo, phase: trained, blocks: [constraint_phase, tralo, tralo_lam0],
     null_sibling: tralo_null}
  # DIRECTION, not placement: the count is untouched and the STEP is projected.
  # Shares `tralo_null` for the same reason the others do -- at lambda 0 there
  # is no constraint gradient, so there is nothing to project and a dedicated
  # null would be a bit-identical run costing a GPU slot.
  tralo_ortho:
    {methodology: tralo, phase: trained, blocks: [constraint_phase, tralo, tralo_ortho],
     null_sibling: tralo_null}
  tralo_head:
    {methodology: tralo, phase: trained, blocks: [constraint_phase, tralo, tralo_head],
     null_sibling: tralo_null}
  # Same code path as tralo, treatment zeroed. See the tralo_null block above.
  tralo_null: {methodology: tralo,          phase: trained, blocks: [constraint_phase, tralo_null]}
  # THE RESEED CONTROL. `tralo_null` plus one draw from the global generator --
  # the deliberate version of what `select_null` did by accident. It is
  # `null_sibling: tralo_null` because that is the arm it must be READ against:
  # the pair IS the measurement, and neither half means anything alone.
  #
  # `count_control: true` does two things, and both are deliberate. It keeps
  # this arm OUT of `--arms all` -- adding a trained arm is a compute decision,
  # the same rule that keeps the zero-dose siblings out -- and it makes
  # gen_campaign REFUSE any campaign holding a trained arm without it, because
  # a trained arm is exactly what writes a count trajectory and a count
  # trajectory without this floor beside it is not readable. `--arms all+null`
  # includes it.
  tralo_reseed:
    {methodology: tralo, phase: trained,
     blocks: [constraint_phase, tralo_null, tralo_reseed],
     null_sibling: tralo_null, count_control: true}
  # The second RNG replicate. Same methodology, same warm-up, same lambda=0,
  # different stream -- so it is a count control exactly as `tralo_reseed` is,
  # and `|tralo_reseed - tralo_reseed2|` is as legitimate a floor observation
  # as `|tralo_null - tralo_reseed|`.
  tralo_reseed2:
    {methodology: tralo, phase: trained,
     blocks: [constraint_phase, tralo_null, tralo_reseed2],
     null_sibling: tralo_null, count_control: true}
  # 1c. Not a count penalty and not a score-pushing term -- it reweights the
  # CLASSIFICATION loss over the covered set. See src/methodologies/select/train.py.
  # ⛔ `select` is REJECTED (section 12); `select_null` remains a live control.
  # `constraint_step: false` is load-bearing, not decoration: it declares that
  # this arm takes NO constraint step, so it is exempt from the rule that every
  # trained arm carries `constraint_phase`. The exemption is checked -- an arm
  # declaring it may not carry a single constraint_phase key, which is what
  # stops the exemption from becoming a way to smuggle in dead keys.
  select:
    {methodology: select, phase: trained, blocks: [chunked, select],
     null_sibling: select_null, constraint_step: false}
  select_null:
    {methodology: select, phase: trained, blocks: [chunked, select_null],
     constraint_step: false}
  # `null_sibling: tralo_null` for all three. At lambda 0 no constraint gradient
  # is formed at all, so `dual_common`'s epoch loop and `tralo/train.py`'s
  # collapse to the SAME pure-CE run -- the identical argument already applied
  # to tralo_coin/st/margin above, extended across a code-path boundary.
  #
  # MEASURED, not assumed. In `results/dualbar2` all four zero-dose arms emit
  # one md5 (`1bfa966cdf01`) at BOTH cap levels, and 47 of 49 training-log
  # columns are equal -- the two exceptions being the limit columns, which are
  # the budget itself.
  #
  # THE ARITHMETIC, stated exactly, because a rounded version of it has already
  # been quoted wrong. 4 null arms x 2 caps x 4 seeds = 32 null runs, and the
  # null is ALSO cap-blind, so they collapse to 4 distinct models -- one per
  # seed. 28 of the 32 are redundant. The sibling map below removes 24 of them
  # (3 arms x 2 caps x 4 seeds); the last 4 need cross-cap reuse of a TRAINED
  # model, which is a cache change and is not done here.
  # ⚠️ The two CLIPPERS are not part of this. They look duplicated across caps
  # and are not waste: a post-hoc arm's model IS its warm-up, so the second cap
  # hits the warm-up cache and writes no training_log at all. Timing them by
  # mtime gaps says 4.4 min and attributes the previous run's tail to them.
  #
  # The equivalence is GATED, because it is now load-bearing rather than
  # incidental: test_every_zero_dose_arm_is_the_same_model_across_code_paths
  # runs all four through the smoke harness and requires bit-identity, with a
  # treated arm as its liveness control. If that test ever fails, a shared null
  # is unsound and these three lines must go back to per-family nulls.
  fioretto:   {methodology: fioretto_ldf,   phase: trained, blocks: [constraint_phase, fioretto],
               null_sibling: tralo_null}
  hounie:     {methodology: hounie_rcl,     phase: trained, blocks: [constraint_phase, hounie],
               null_sibling: tralo_null}
  alm:        {methodology: fioretto_alm,   phase: trained, blocks: [constraint_phase, alm],
               null_sibling: tralo_null}
  # The per-family zero-dose siblings are KEPT as named arms, not deleted: they
  # are how the equivalence above gets re-verified on real data when something
  # about the trainers changes. They are simply no longer scheduled by default.
  fioretto_null: {methodology: fioretto_ldf, phase: trained, blocks: [constraint_phase, fioretto_null]}
  hounie_null:   {methodology: hounie_rcl,   phase: trained, blocks: [constraint_phase, hounie_null]}
  alm_null:      {methodology: fioretto_alm, phase: trained, blocks: [constraint_phase, alm_null]}

# Arms the framework has REJECTED. `gen_campaign` subtracts these from `all`
# and `all+null`, and shouts if one is named explicitly. Naming still works, so
# the campaign that produced the verdict stays reproducible -- a rejected arm
# just cannot arrive by default. An entry here is a claim with a receipt: put
# the section that holds the measurement in the value.
# ARMS THAT HAVE NEVER PRODUCED A SINGLE COMPLETED RUN, anywhere in the
# 14-worktree family (counted 2026-09-02 over every `config.json` with
# `status: completed`). They are DECLARATION DEBT, not results: nothing in the
# corpus, the paper or any doc rests on them.
#
# \U0001f6d1 THEY ARE NOT `rejected_arms`, AND THE DIFFERENCE IS THE WHOLE
# POINT OF THIS PROJECT'S BOOKKEEPING. A rejected arm was MEASURED and lost; an
# unproven arm was never measured. Filing the second as the first would claim a
# result nobody produced -- the exact error the `no prize` / `prize<floor` /
# `no data` split in `task_window` exists to prevent.
#
# `--arms all` skips them. Naming one explicitly still works, so building the
# evidence is one flag away; when it exists, move the arm out of this list.
unproven_arms:
  tralo_ortho: "0 completed runs. And `scripts/ortho_survival` already prices
    it as unpromising WITHOUT a campaign: `ortho_project` delivers 0.0% of its
    promised CE-neutrality in 16/16 conditions, because 92.6% of the momentum
    is stale CE the projection never touches and `sqrt(v)` breaks the
    orthogonality of the 7.4% it does. Run the probe, not the campaign."
  tralo_margin: "0 completed runs. `scripts/step_direction_probe` measures its
    head-gradient direction at cosine 0.989 from `tralo` on REAL features, so
    it would mostly reproduce `tralo` at full campaign cost."
  tralo_coin: "EXERCISED, and the result is UNMEASURED rather than null.
    This entry said `0 completed runs and no recorded rationale` until
    2026-09-06; there are 24, in `vitcoin1` (ViTB16), `coin1`
    (RegNetY400MF) and `coin2` (MobileNetV2). Nobody had read them because
    `scripts/deployed_h2h` ranked a four-name whitelist and this arm was
    not in it.
    Scored 2026-09-06 over coin1+coin2 (4 cells, 4 seeds): `tralo` leads
    the coin by +4.25 / +2.25 / -4.00 / +1.75 deployed TP items, i.e. 3 of
    4 in TraLO's favour at sign p=0.31, and EVERY cell is inside its own
    RNG floor (2.0-6.0 items, n=4, under MIN_FLOOR_OBS).
    So do NOT quote `TraLO ties a random step of the same norm` as
    settled -- it rests on four unpriced cells. The arm stays UNPROVEN,
    and it is the pre-registered kill condition, so it belongs in any
    campaign making a claim about the constraint DIRECTION."
  tralo_st: "0 completed runs. Named in FRAMEWORK's inert-flag discussion as
    one of eleven trained arms, but no run of it survives in results/."

rejected_arms:
  tralo_cut: "REJECTED on its first campaign, 2026-09-02. `taskwin2` landed
    48/48 at 232/232 dose and it did not beat `tralo`. Held one confirmation
    short of final only because `vittask1` was stopped at 13/48; do not re-run
    it on MobileNetV3, where the class-2 strict band is empty anyway."
  tralo_uniform: "REJECTED. 0 of 4 task cells, and its FOUNDING CLAIM is
    refuted by `scripts/bias_shift_probe`: the docstring argued a uniform step
    in log-odds is a pure bias shift that cannot reorder, but the step is taken
    in PARAMETERS -- `dz_i = -lr*g*n*(fbar.f_i + 1)`, which varies with
    `fbar.f_i` -- so it reorders, and it does so through the linear head
    alone. Separately it ran
    at 1/29 dose in one campaign while `tralo` ran 29/29. Pure algebra, no
    artefact needed to re-check."
  cb_lp: "MATHEMATICALLY PLAIN CE on iwildcam, so it is not a baseline here.
    The TRAIN set is exactly 2500/class (imbalance 1.0x -- the 4.5x figure is
    the TEST set), so `class_balanced`'s weights are exactly 1.0 and weighted
    CE is plain CE BITWISE: its raw predictions are byte-identical to `clip`'s
    in 24/24. Legitimate on a dataset whose TRAIN prior is actually skewed;
    `prior_arm_gate` decides per dataset and `--allow-inert-baseline` overrides."
  la_lp: "MATHEMATICALLY PLAIN CE on iwildcam, and it FAILS DIFFERENTLY from
    `cb_lp`, which is why only one was caught. `logit_adjust` adds
    `tau*log(prior)`, a CONSTANT vector, and `log_softmax` is shift-invariant,
    so the objective is unchanged -- yet its predictions DIFFER from `clip` in
    24/24, because the constant moves float rounding by ~1e-9 and 30 epochs
    compound it. Gradient delta vs CE: max 9.3e-10. md5 divergence is NOT
    evidence of a live mechanism."
  select: >-
    docs/FRAMEWORK.md section 12, scored 2026-08-22: -0.1096 AP and -0.0804 ccF1
    = -22 items vs `clip`, 0 of 2 cells on every metric, and 2 of 8 runs
    collapsed on their final epoch. `select_null` ties `clip`, so the selective
    term owns the loss. Do not re-run at any eta, tau or cov_weight.
  select_null: >-
    the zero-dose sibling of a rejected arm. Kept runnable so section 12 can be
    reproduced, but it is warm-up 1 plus 29 CE epochs -- which `tralo_null`
    already provides in any campaign that carries a live arm.

# Added to every campaign whether requested or not: an arm-vs-arm delta is not a
# result until the bar is in the same campaign.
mandatory_arms: [clip, focal_clip]
# REQUIRED, but conditionally, so it is a refusal rather than an auto-add: any
# campaign holding a TRAINED arm holds a count trajectory, and a count
# trajectory is unreadable without the reseed floor beside it (the constraint
# moves the capped count 0.90-1.00x as far as re-randomising the dropout stream
# does). Auto-adding it would grow the trained half of a campaign silently,
# which is the scope expansion this project has a rule against, so gen_campaign
# names it and stops instead. Post-hoc-only campaigns write no count trajectory
# and are not affected.
# NOT mandatory yet -- that is Roei's call, and it is the same argument that put
# the clippers here. Every trained arm now HAS a zero-dose sibling
# (`tralo_null`, `fioretto_null`, `hounie_null`, `alm_null`) separating the
# REGIME -- warm-up 1 + 29 transductive epochs + optimizer restart -- from the
# TREATMENT, the count gradient. Without the sibling in the campaign, an
# arm-vs-clip delta cannot be attributed to the constraint at all.
#
# Left opt-in rather than auto-added because adding four arms DOUBLES the
# trained half of a campaign, and that is a compute decision, not a hygiene one.
# gen_campaign warns when a trained arm is selected without its sibling.
# Add them with --arms ... tralo_null fioretto_null hounie_null alm_null.

datasets:
  # 🛑 dermmnist, octmnist and tissuemnist were REMOVED 2026-08-22.
  # `scripts.dataset_screen` measured that none of them can carry a count
  # constraint, so no campaign should be able to select one by accident:
  #   iwildcam/oodslice  NET +3131 items (z=97.4)  unseen groups 7
  #   dermmnist/slice_1  NET   +65 items (z= 2.9)  unseen groups 0
  #   octmnist/slice_1   NET    -7 items (z=-0.4)  unseen groups 0
  #   tissuemnist        NET   -56 items (z=-1.9)  unseen groups 0
  # oct and tissue are dead BY CONSTRUCTION -- `synth_group` was
  # `np.arange(len(y)) % 3`. derm passes the screen and still nulls,
  # because its test groups ARE its training groups. The full record
  # stays in docs/FRAMEWORK.md 2(n) and in the archive; what is gone is
  # the ability to RUN them. Restoring one needs a screen number first.
  iwildcam:
    # THE FIRST DATASET THAT CLEARS THE FRAMEWORK 2(n) CRITERION.
    # Held-out camera traps: the 7 test cameras are DISJOINT from the 150
    # training cameras, so the model holds no per-camera species prior and the
    # local cap is the only source of one. Measured novelty, differential and
    # net of both sampling noise and the global shift:
    #     dermmnist/slice_1   NET   +65 items (z=2.9)   unseen groups 0
    #     iwildcam/oodslice   NET +3131 items (z=97.4)  unseen groups 7
    #
    # Capped classes 2 (impala) and 7 (cattle) are chosen for their per-camera
    # STRUCTURE, not their frequency: they are seen at 3 and 4 of the 7 test
    # cameras respectively, so their local budgets differ across cameras
    # instead of being one number divided up. Classes 0/3/4/5 each appear at a
    # single camera, which would make the local cap trivially equal to the
    # global one.
    #
    # 4 of 7 cameras carry a K=0 ceiling for class 2. A ZERO CEILING ALWAYS
    # BINDS, so unlike dermmnist -- where `lp_fallback_used` was False with 0
    # candidates on all 52 completed runs -- the local scope constrains the
    # OUTPUT here at EVERY cap level, including the ones where the global
    # binds the totals. That is the regime FRAMEWORK 2(l) found had never
    # once been tested.
    #
    #   L50_G20  class 2: global K= 74 | local [54,0,0,51,0,80,0] sum=185
    #   L20_G50  class 2: global K=185 | local [22,0,0,20,0,32,0] sum= 74
    #   L30_G30  is REDUNDANT here as everywhere: local sum equals global exactly.
    data_dir: data/iwildcam/oodslice
    num_classes: 8
    group_column: location      # camera trap; test cameras DISJOINT from train
    constrained_class: [2, 7]   # impala 12.6% / cattle 15.5% of test
    disjoint_groups: true       # test cameras MUST NOT appear in train.
                                # Read by src/utils/data_loader.py, which
                                # RAISES on overlap rather than warning:
                                # one shared camera restores the per-camera
                                # prior the model is supposed to lack, and
                                # silently turns this back into dermmnist.
  cct:
    # THE SECOND DATASET THAT CLEARS THE FRAMEWORK 2(n) CRITERION.
    # Caltech Camera Traps / Terra Incognita (Beery et al., ECCV 2018), read by
    # the same generic COCO-CameraTraps split builder as iwildcam: 5 test
    # cameras held out ENTIRE from 128 training cameras, 0 overlap.
    # Screened 2026-08-23 with `scripts.dataset_screen` (meta only, no images):
    #     iwildcam/oodslice   NET +3131 items (z=97.4)  unseen groups 7
    #     cct/oodslice        NET +2546 items (z=75.8)  unseen groups 5
    #     dermmnist/slice_1   NET   +65 items (z= 2.9)  unseen groups 0
    # NET 2546 of LOCAL 2810, so the novelty is genuinely DIFFERENTIAL and not
    # the global shift replicated across groups -- contrast dermmnist shift_1,
    # where 110 of its 160 was global in disguise.
    #
    # NOT AN INDEPENDENT GENERALIZATION UNIT FROM iwildcam. Same authors, same
    # sensor modality, same schema; FRAMEWORK 2(n) flags this. It raises the
    # dataset count D from 1 to 2, moving the exact sign-flip floor 2^(1-D)
    # from 1.00 to 0.50, but a reviewer is entitled to call the two one unit.
    # A genuinely independent third must be non-camera-trap (ISIC 2019).
    #
    # CAPPED CLASSES: chosen by iwildcam's criterion -- per-camera STRUCTURE,
    # not frequency -- and the choice is a TRADE-OFF, so here is the whole
    # table rather than the two winning rows. Test counts by camera
    # (cols = 37 / 51 / 53 / 78 / 135), verified 2026-08-23 from test_meta.csv:
    #
    #   class            37   51   53   78  135   total  zero ceilings  support
    #   0                 0  236    0  376    0     612       3         {51,78}
    #   1                 6  144    0  104   20     274       1         {37,51,78,135}
    #   2 rabbit          0  243    0    3  180     426       2         {51,78,135}
    #   3               151    0   42    0   88     281       2         {37,53,135}
    #   4                 0   12    3  345    0     360       2         {51,53,78}
    #   5 bird            6    9   92    6  136     249       0    <== no zero ceiling
    #   6 bobcat         12  263    0  107    0     382       2         {37,51,78}
    #   7 cat             0    0    0  401    0     401       4    <== ONE camera
    #
    # Two properties are wanted and they PULL APART, which is why the pick is
    # not simply the top of one column:
    #   (a) ZERO CEILINGS. A K=0 ceiling binds regardless of sum slack, so it
    #       is what makes the LOCAL scope constrain the output at all.
    #   (b) DISTINCT SUPPORTS. If one capped class's cameras are a SUBSET of
    #       the other's, the two local budget vectors are one constraint
    #       wearing two hats rather than two.
    #
    # Class 0 wins (a) outright -- 3 zero ceilings and the largest test count
    # at 612 -- but its support {51,78} is a strict SUBSET of both class 2's
    # and class 6's, so pairing it with either fails (b). Classes 2 and 6 take
    # 2 zero ceilings each (4 of 10, against iwildcam's 7 of 14) and their
    # supports are genuinely non-nested: 135 is in class 2's and not class 6's,
    # 37 is in class 6's and not class 2's. They are chosen because they are
    # the pair that satisfies BOTH, not because 3-of-5 presence is a criterion.
    # ⚠️ If a CCT campaign ever wants maximum binding structure and can accept
    # nested supports, class 0 is the alternative and the reason is above.
    #
    # Rejected outright: class 7 (cat) sits at ONE test camera, so the local
    # cap collapses onto the global one -- the exact case iwildcam excluded --
    # and class 5 (bird) sits at all five, carrying no zero ceiling at all.
    data_dir: data/cct/oodslice
    num_classes: 8
    group_column: location      # camera trap; test cameras DISJOINT from train
    constrained_class: [2, 6]   # rabbit 14.3% / bobcat 12.8% of test
    disjoint_groups: true       # same guard as iwildcam: data_loader RAISES on
                                # any train/test camera overlap.

models: [MobileNetV3, MobileNetV2, RegNetY400MF, ViTB16]

# Keys that change WHAT THE WARM-UP OPTIMIZES. These and only these enter
# base_model_id, so two arms share a cached warm-up exactly when they should:
# `clip` and `lp` differ only in the allocator and reuse one trained model,
# while `focal_clip` trains its own because its objective differs. Anything that
# changes the warm-up and is missing here silently reuses the wrong model.
warmup_identity_keys:
  - lr
  - dropout
  - batch_size
  - warmup_epochs
  - pretrained
  - class_weighted_ce
  - seed
  - warmup_loss
  - focal_alpha
  - focal_gamma
  - cb_beta
  - logit_adjust_tau
