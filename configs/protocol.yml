protocol:
  total_epochs: 30
  trained_warmup: 1
  seeds:
  - 1
  - 2
  - 3
  - 4
core:
  lr: 0.0001
  dropout: 0.3
  batch_size: 64
  pretrained: true
constraint_phase:
  constraint_grad_clip: 1.0
  constraint_grad_mode: normalize
  constraint_fp32: true
  lr_constraint: 0.0001
  constraint_chunk_size: 128
blocks:
  tralo:
    lambda_step: 0.05
    lambda_global: 0.01
    lambda_local: 0.01
    initial_rho: 0.5
    rho_target: 100.0
    # Per-epoch probability snapshots, scored offline. Declared HERE and not in
    # `core` because `audit_config` refuses any config key without a live
    # runtime reader, and only tralo/train.py reads it -- in core it landed in
    # clip, fioretto, hounie and alm configs, where nothing would ever have read
    # it. Every tralo-methodology arm carries exactly one of the three dual
    # blocks, so declaring it on each of them covers the family and nothing else.
    epoch_trace: true
  tralo_null:
    lambda_step: 0.0
    lambda_global: 0.0
    lambda_local: 0.0
    initial_rho: 0.5
    rho_target: 100.0
    # Per-epoch probability snapshots, scored offline. Declared HERE and not in
    # `core` because `audit_config` refuses any config key without a live
    # runtime reader, and only tralo/train.py reads it -- in core it landed in
    # clip, fioretto, hounie and alm configs, where nothing would ever have read
    # it. Every tralo-methodology arm carries exactly one of the three dual
    # blocks, so declaring it on each of them covers the family and nothing else.
    epoch_trace: true
  # Same duals as `tralo`; the ONLY difference is that the soft count is
  # weighted per item. The reference count is an unweighted sum, so
  # dL/dp_i(c) = psi'(S_c) is identical for every item and the constraint knows
  # nothing about item i that the post-hoc allocator does not already rank by.
  # Neighbourhood disagreement is label-free and DOES carry information p lacks:
  # among items placed in a capped class at p >= 0.99 it predicts WRONG at AUC
  # 0.87, against 0.68 for a margin control that is a pure function of p.
  tralo_stab:
    lambda_step: 0.05
    lambda_global: 0.01
    lambda_local: 0.01
    initial_rho: 0.5
    rho_target: 100.0
    constraint_weight: knn_disagree
    constraint_weight_k: 20
    constraint_weight_floor: 0.05
    # Per-epoch probability snapshots, scored offline. Declared HERE and not in
    # `core` because `audit_config` refuses any config key without a live
    # runtime reader, and only tralo/train.py reads it -- in core it landed in
    # clip, fioretto, hounie and alm configs, where nothing would ever have read
    # it. Every tralo-methodology arm carries exactly one of the three dual
    # blocks, so declaring it on each of them covers the family and nothing else.
    epoch_trace: true
  fioretto:
    fioretto_step_size: 0.005
    fioretto_lambda_init: 0.0
  hounie:
    hounie_eta_lambda: 0.1
    hounie_eta_u: 0.1
    hounie_alpha: 1.0
  alm:
    alm_eta: 0.005
    alm_mu0: 0.01
    alm_mu_step: 0.01
    fioretto_lambda_init: 0.0
  focal:
    warmup_loss: focal
    focal_alpha: 0.25
    focal_gamma: 2.0
  augment:
    augment: true
  # THE BUDGET SWEEP. The live fraction -- live window / constraint epochs -- is
  # the quantity the whole account turns on, and until now it could only be
  # varied BETWEEN campaigns, where it is confounded with backbone, code version
  # and cap set. These blocks make it a within-campaign factor: the live window
  # is a property of the recipe (~3 epochs plain), so shrinking the budget
  # raises the live fraction from 10% at 30 epochs to 75% at 5.
  #
  # The grid is placed where the effect CHANGES SIGN, not spread evenly. The
  # between-campaign evidence flips between 30% (live11, -0.0089) and 60%
  # (live6b, +0.0079), so b6 (60%) and b7 (50%) bracket it and b5 (75%) anchors
  # the live end. A first attempt used b5/b8/b12/b20/b30 and put FOUR of five
  # points in the frozen regime with none between 43% and 75% -- the firstrun
  # saturation gate caught it at 6 of 384 runs.
  #
  # Budget 30 is deliberately ABSENT: it is the protocol default, so the plain
  # `tralo`/`tralo_null`/`clip` arms already are the 30-epoch level and adding a
  # b30 block would generate a second copy of them under a different name.
  b5:
    total_epochs: 5
  b6:
    total_epochs: 6
  b7:
    total_epochs: 7
  b8:
    total_epochs: 8
  b12:
    total_epochs: 12
arms:
  tralo:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo
  tralo_null:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo_null
  # `tralo` is this arm's own control: same duals, same schedule, same budget,
  # differing ONLY in whether the soft count is weighted. `tralo_null` remains
  # the zero-constraint floor both must clear. Pre-registered reading: plain
  # TraLO ties its null at +0.001 to +0.004, so tralo_stab minus tralo_null is
  # the number that decides whether a per-item channel exists at all.
  tralo_stab:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo_stab
  aug_tralo_stab:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo_stab
    - augment
  # The constraint reaches the weights only through d(soft count)/d(theta),
  # whose per-item weight is p(1-p). Measured on fm2_mn3: mean 0.007-0.023
  # against a 0.25 maximum, with the top 1% of items carrying 34% of the total
  # on class 1 -- so a few dozen borderline items choose the whole direction,
  # which `normalize` then rescales to full size. Under focal the same mean is
  # 0.015-0.045 and the top 1% carries 5-16%. This arm gives the constraint a
  # gradient it can steer with; `focal_clip` is its matched post-hoc control.
  focal_tralo:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo
    - focal
  clip:
    methodology: heuristic
    phase: posthoc
    blocks: []
  focal_clip:
    methodology: heuristic
    phase: posthoc
    blocks:
    - focal
  # The 2x2 amendment: focal enlarges the constraint's gradient, augmentation
  # UNFREEZES THE BOUNDARY, and the corrected chain says only the second can
  # move gAP. So these two arms are each other's discriminating test, not two
  # candidates to pick a winner from -- see the pre-registration amendment in
  # docs/MISSION.md. `aug_clip` is the matched post-hoc control; without it the
  # augmented warm-up's own main effect would be read as the constraint's.
  aug_tralo:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo
    - augment
  # Each intervention column needs its OWN zero-constraint control. Without
  # these, the only comparisons available inside the augmented column are
  # aug_tralo vs aug_clip (different SCHEDULE -- 1+5 against 6+0) and aug_tralo
  # vs tralo (different AUGMENTATION). Neither isolates the constraint, which is
  # the whole quantity under test. tralo_null is the plain column's control and
  # cannot serve the others.
  aug_tralo_null:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo_null
    - augment
  focal_tralo_null:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo_null
    - focal
  aug_clip:
    methodology: heuristic
    phase: posthoc
    blocks:
    - augment
  # Each budget carries its OWN null and its OWN clipper. The null cannot be
  # shared across budgets: lambda=0 removes the constraint but the constraint
  # phase still runs full cross-entropy every epoch, so a 5-epoch null is a
  # differently trained model from a 30-epoch one. The clipper cannot be shared
  # either -- if short budgets hurt every arm, the constraint's standing is the
  # relative one, and only a matched clipper can show that.
  tralo_b5:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo
    - b5
  tralo_null_b5:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo_null
    - b5
  clip_b5:
    methodology: heuristic
    phase: posthoc
    blocks:
    - b5
  tralo_b6:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo
    - b6
  tralo_null_b6:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo_null
    - b6
  clip_b6:
    methodology: heuristic
    phase: posthoc
    blocks:
    - b6
  tralo_b7:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo
    - b7
  tralo_null_b7:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo_null
    - b7
  clip_b7:
    methodology: heuristic
    phase: posthoc
    blocks:
    - b7
  tralo_b8:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo
    - b8
  tralo_null_b8:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo_null
    - b8
  clip_b8:
    methodology: heuristic
    phase: posthoc
    blocks:
    - b8
  tralo_b12:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo
    - b12
  tralo_null_b12:
    methodology: tralo
    phase: trained
    blocks:
    - constraint_phase
    - tralo_null
    - b12
  clip_b12:
    methodology: heuristic
    phase: posthoc
    blocks:
    - b12
  fioretto:
    methodology: fioretto_ldf
    phase: trained
    blocks:
    - constraint_phase
    - fioretto
  hounie:
    methodology: hounie_rcl
    phase: trained
    blocks:
    - constraint_phase
    - hounie
  alm:
    methodology: fioretto_alm
    phase: trained
    blocks:
    - constraint_phase
    - alm
mandatory_arms:
- clip
- focal_clip
datasets:
  # iwildcam REMOVED 2026-09-14. It passes 2 of the 8 candidate conditions:
  # 2 of 8 classes can carry a local cap, half the per-group ceilings are K=0
  # before training starts, and 72% of test items sit in groups holding NEITHER
  # capped class. Its per-group label shift is the best in the corpus (TV 0.737)
  # and that is the SAME fact as its density of 0.27 -- the shift IS the
  # sparsity. Data and completed runs are archived, not deleted; it is removed
  # here so no campaign can be generated on it again.
  #
  # fmow/oodslice REMOVED with it: built by a basename join that collapsed
  # distinct AOIs (7,429 basenames under >1 AOI, 16.4% of records mis-joined),
  # which is how false_detection crops carried neighbouring sites' labels.
  # Superseded by fmow2 below, rebuilt on an AOI-qualified key.
  fmow2:
    data_dir: data/fmow2/oodslice
    num_classes: 8
    group_column: location
    # crop_field(1), place_of_worship(2), ground_transportation_station(7):
    # the three most evenly spread classes, measured on this slice's own test
    # labels -- present in 10/10, 9/10 and 8/10 groups with max-group shares
    # 0.26, 0.35 and 0.32 and only 3 zero ceilings between them at an 80% cap.
    # NOT 3 and 5, which fmow/oodslice declared: class 3 lives in 6 of 10 groups
    # with 4 zero ceilings, and class 6 (3/10 groups, 0.76 concentration) is the
    # iwildcam failure mode exactly.
    constrained_class:
    - 1
    - 2
    - 7
    disjoint_groups: true
  bcn:
    data_dir: data/bcn/oodslice
    num_classes: 8
    group_column: location
    constrained_class:
    - 0
    - 2
    disjoint_groups: true
models:
# SmallCNN is DIAGNOSTIC ONLY (restored 2026-09-15). It exists to separate "the
# constraint damages the boundary" from "the constraint always arrives after the
# boundary has stopped moving", which no pretrained backbone here can do because
# all of them memorise in 3-5 epochs. It is not a claimed backbone: FRAMEWORK
# section 1 still fixes the paper's set at the four below.
- SmallCNN
- MobileNetV3
- MobileNetV2
- RegNetY400MF
- ViTB16
warmup_identity_keys:
# `augment` is here and NOT in `core`: the warm-up cache must separate an
# augmented warm-up from an unaugmented one, but adding the key to every config
# would change every existing base_model_id digest and invalidate the whole
# cache. compute_base_model_id only includes identity keys present in hp.
- augment
- lr
- dropout
- batch_size
- warmup_epochs
- pretrained
- seed
- warmup_loss
- focal_alpha
- focal_gamma
