[pytest]
testpaths = tests
markers =
    stage1_data: the slice itself, before a single image is loaded
    stage2_budget: the cap arithmetic, before a config is written
    stage3_model: the backbone and the warm-up cache, before training
    stage4_grid: apples-to-apples across the campaign, before launch
    stage5_trainlog: what the optimiser actually did, during and after
    stage6_results: what may be read off the output, before any claim
